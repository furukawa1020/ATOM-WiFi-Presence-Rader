[platformio]
default_envs =
    tx_coordinator
    rx_1
    rx_2
    rx_3

boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = m5stack-atoms3r

upload_speed = 460800
monitor_speed = 115200

monitor_filters =
    esp32_exception_decoder
    time

lib_ldf_mode = deep+
lib_compat_mode = strict

lib_deps =
    m5stack/M5Unified @ 0.2.20

build_flags =
    -Wall
    -Wextra
    -Werror=return-type
    -DCORE_DEBUG_LEVEL=3
    -DAPP_PROTOCOL_VERSION=1
    -DCSI_TARGET_SAMPLE_RATE_HZ=100
    -DSUMMARY_RATE_HZ=10
    -DRADIO_CHANNEL=6
    -DRADIO_BANDWIDTH_MHZ=20

[env:tx_coordinator]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=0
    -DNODE_ID=0

[env:rx_1]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=1
    -DNODE_ID=1

[env:rx_2]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=1
    -DNODE_ID=2

[env:rx_3]
build_flags =
    ${env.build_flags}
    -DNODE_ROLE=1
    -DNODE_ID=3

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
